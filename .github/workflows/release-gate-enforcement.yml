name: Life OS Release Gate & State Machine Enforcement

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-release-ledger:
    name: Validate Release Ledger & Enforce Fail-Closed Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate Release Ledger State Machine
        run: |
          python3 scripts/release_state_machine.py validate

      - name: Run Release State Machine Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Run Slack Resource Inbox Tests (if active)
        run: |
          if [ -d "slack-resource-inbox/tests" ]; then
            python3 -m unittest discover -s slack-resource-inbox/tests -v
          else
            echo "Slack Resource Inbox is archived. Skipping archived component tests."
          fi

      - name: Run Status Bridge Unit Tests
        run: |
          python3 -m unittest discover -s status-bridge/tests -v
