version: '3.8'

services:
  n8n-staging:
    image: docker.n8n.io/n8nio/n8n:2.31.6
    container_name: n8n-staging
    environment:
      - N8N_PORT=5679
      - N8N_PROTOCOL=http
      - N8N_HOST=127.0.0.1
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_LOG_LEVEL=info
      - STAGING_ENVIRONMENT_ID=staging-isolated-local-01
      - SYNTHETIC_DATA_ONLY=true
    ports:
      - "127.0.0.1:5679:5679"
    volumes:
      - ./data:/home_node_n8n_staging
      - ./fixtures:/fixtures:ro
    restart: unless-stopped
